services:
  - type: web
    name: mastermind-bot
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: STORAGE_CHANNEL_ID
        sync: false
      - key: POSTING_CHANNEL_ID
        sync: false
      - key: LOGGER_GROUP_ID
        sync: false
      - key: REQUEST_CHANNEL_ID
        sync: false
      - key: SUPPORT_CHAT_ID
        sync: false
      - key: BACKUP_CHAT_ID
        sync: false
