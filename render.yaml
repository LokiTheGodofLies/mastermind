# Default Python runtime: no Calibre / Pandoc, so /convert answers "unavailable". For the
# converter switch the service to `env: docker` (uses ./Dockerfile, which installs Calibre,
# Pandoc and requirements-converter.txt) and remove buildCommand/startCommand.
services:
  - type: web
    name: mastermind-bot
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: STORAGE_CHANNEL_ID
        sync: false
      - key: POSTING_CHANNEL_ID
        sync: false
      - key: LOGGER_GROUP_ID
        sync: false
      - key: REQUEST_CHANNEL_ID
        sync: false
      - key: SUPPORT_CHAT_ID
        sync: false
      - key: BACKUP_CHAT_ID
        sync: false
